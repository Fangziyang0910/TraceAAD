[project]
name = "traceaad"
version = "2.0"
description = "TraceAAD: traced automatic algorithm design research repo (core evaluation from LLM4AD)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy<2",
    "tensorboardX",
    "wandb",
    "scipy",
    "tqdm",
    "numba",
    "requests",
    "openai",
    "pytz",
    "matplotlib",
    "huggingface_hub",
    "scikit-learn>=1.9.0",
]

[tool.uv]
# Virtual project: dependencies only. The repo runs via `python -m` from the
# repo root (and from frozen runtime copies), so never build/install the
# project itself — a setuptools packages.find scan walks the huge results
# trees under experiments/ and stalls.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

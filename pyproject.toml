[project]
name = "traceaad"
version = "2.0"
description = "TraceAAD: traced automatic algorithm design research repo (core evaluation from LLM4AD)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy<2",
    "scipy",
    "tqdm",
    "numba",
    "requests",
    "openai",
    "pytz",
    "matplotlib",
    "huggingface_hub",
    "scikit-learn>=1.9.0",
]

[tool.uv]
# Virtual project: uv manages dependencies and runs repository modules without
# installing this research tree as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

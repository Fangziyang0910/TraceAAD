[project]
name = "TraceAAD"
version = "2.0"
description = "TraceAAD: traced automatic algorithm design research repo (core evaluation from LLM4AD)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub",
    "matplotlib",
    "numba",
    "numpy>=2",
    "onnxruntime",
    "openai",
    "psutil>=7.2.2",
    "requests",
    "scikit-learn",
    "scipy",
    "tokenizers",
]

[tool.uv]
# Virtual project: uv manages dependencies and runs repository modules without
# installing this research tree as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

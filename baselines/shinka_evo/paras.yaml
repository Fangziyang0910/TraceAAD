max_sample_nums: 1000
num_generations: 1000
num_islands: 2
archive_size: 40
patch_types: ["diff", "full", "cross"]
patch_type_probs: [0.45, 0.45, 0.1]
parent_selection_strategy: "weighted"
num_archive_inspirations: 4
num_top_k_inspirations: 2
max_patch_resamples: 3
max_novelty_attempts: 3
code_embed_sim_threshold: 0.95
elite_selection_ratio: 0.3
exploitation_alpha: 1.0
parent_selection_lambda: 10.0
num_beams: 5
archive_selection_strategy: "fitness"
archive_criteria:
  combined_score: 1.0
enforce_island_separation: true
island_selection_strategy: "uniform"
migration_interval: 10
migration_rate: 0.0
island_elitism: true
meta_rec_interval: 10
sample_single_meta_rec: true
use_text_feedback: false
inspiration_sort_order: "ascending"
llm_ucb_exploration_coef: 1.0
llm_ucb_epsilon: 0.2
llm_ucb_auto_decay: 0.95

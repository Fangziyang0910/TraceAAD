<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:var(--font-sans)}
*{box-sizing:border-box}body{margin:0;color:var(--foreground)}
figure{margin:0 0 22px}.paper{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
img{display:block;width:100%;height:auto}img[hidden]{display:none}
figcaption{font-size:13px;line-height:1.7;color:var(--muted-foreground);margin-top:12px}figcaption strong{color:var(--foreground)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.tab,.zoom{font:inherit;font-size:12px;line-height:1.5;border:1px solid var(--border);border-radius:7px;padding:7px 11px;cursor:pointer;color:var(--foreground);background:var(--secondary)}
.tab[aria-selected=true]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}.toolbar strong{font-size:14px;font-weight:600}.zoom{padding:5px 9px;flex:none}
.pan{overflow:auto;max-height:620px;border-radius:5px}.pan.expanded .detail-image{width:1600px;max-width:none}
.hint{color:var(--muted-foreground);font-size:12px;line-height:1.5;margin:8px 0 0}
</style></head><body>

<script>
const figures={"02-v1-selection": {"src": "/home/fang/code/LLM4AD/TraceAAD/docs/figures/evotrace/02-v1-selection.png", "title": "V1容量选择与结构闭包", "caption": "V1在容量内联合选择算法和必要结构。补入的锚点也参与下一轮距离比较，32是重构后的上限。"}, "03-v2-selection": {"src": "/home/fang/code/LLM4AD/TraceAAD/docs/figures/evotrace/03-v2-selection.png", "title": "V2一次选择与LCA补全", "caption": "V2先在同一快照上确定近期集合与质量代表，再补回必要LCA。示例中补回C，B、G收缩，E剪除。"}, "04-reflective-simplification": {"src": "/home/fang/code/LLM4AD/TraceAAD/docs/figures/evotrace/04-reflective-simplification.png", "title": "联合剪枝与路径收缩的经验归属", "caption": "B、C及B携带的旧经验进入A→D的边经验；新剪旁支X与A已有经验合并到A。每个移除节点只有一个归属。"}, "05-operator-context-v1": {"src": "/home/fang/code/LLM4AD/TraceAAD/docs/figures/evotrace/05-operator-context-v1.png", "title": "V1三类算子的树上下文", "caption": "V1分别组织形成路径、分化分支和全树方向材料。图中子尝试已经受评，每轮只使用一个采样算子。"}, "05-operator-context": {"src": "/home/fang/code/LLM4AD/TraceAAD/docs/figures/evotrace/05-operator-context.png", "title": "V2三类算子的树上下文", "caption": "V2保留三种树视图，并向Explore增加方向内部的变异经验；蓝色标记明确这一扩展。"}, "06-v2-history": {"src": "/home/fang/code/LLM4AD/TraceAAD/docs/figures/evotrace/06-v2-history.png", "title": "V2评价时钟与历史统计", "caption": "真实出生和使用刷新last_used。直接子代数提供采样折扣；承接历史进入反思，五项统计分别累计。"}};let selected='03-v2-selection';
function selectFigure(id){selected=id;const f=figures[id];document.getElementById('detail-title').textContent=f.title;document.getElementById('detail-caption').textContent=f.caption;document.querySelectorAll('.detail-image').forEach(img=>img.hidden=img.dataset.id!==id);document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===id)));document.getElementById('pan').scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>selectFigure(b.dataset.id)));
document.getElementById('zoom').addEventListener('click',()=>{const p=document.getElementById('pan');p.classList.toggle('expanded');document.getElementById('zoom').textContent=p.classList.contains('expanded')?'适合宽度':'放大查看'});selectFigure(selected);
</script></body></html>

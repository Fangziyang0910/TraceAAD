<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>A · 封面</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FB;--ink:#10213E;--mute:#5B6B86;--blue:#1F4E9C;--blue2:#9DB6DD;--line:#C9D5E8;--acc:#E8742A}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','IBM Plex Sans',sans-serif;position:relative}
.rail{position:absolute;left:120px;top:96px;font:600 22px 'IBM Plex Sans';letter-spacing:.18em;color:var(--blue)}
.rail b{display:inline-block;width:56px;height:4px;background:var(--acc);vertical-align:middle;margin-right:18px}
h1{position:absolute;left:120px;top:250px;width:980px;font-size:104px;font-weight:900;line-height:1.16;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--blue)}
.sub{position:absolute;left:120px;top:640px;width:900px;font-size:38px;line-height:1.55;color:var(--mute)}
.who{position:absolute;left:120px;bottom:96px;font-size:28px;line-height:1.7}
.who b{font-weight:700}.who span{color:var(--mute)}
/* chevron stack */
.chain{position:absolute;right:120px;top:100px;width:560px}
.chev{height:112px;margin-bottom:22px;position:relative;background:#fff;border:2px solid var(--line);
 clip-path:polygon(0 0,calc(100% - 56px) 0,100% 50%,calc(100% - 56px) 100%,0 100%,56px 50%);
 display:flex;align-items:center;padding-left:86px;font-size:34px;font-weight:700;color:var(--blue);opacity:0;animation:in .6s ease forwards}
.chev small{font:400 20px 'IBM Plex Sans';color:var(--mute);margin-left:18px}
.chev.f{background:var(--acc);color:#fff;border-color:var(--acc)}.chev.f small{color:#FFE2CF}
.chev:nth-child(1){animation-delay:.2s}.chev:nth-child(2){animation-delay:.5s}.chev:nth-child(3){animation-delay:.8s}.chev:nth-child(4){animation-delay:1.1s}.chev:nth-child(5){animation-delay:1.4s}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
svg.route{position:absolute;right:120px;bottom:50px;width:560px;height:200px}
</style></head><body>
<div class="rail"><b></b>ACADEMIC TALK · 2026.10.10</div>
<h1>通用智能优化中的<br><em>自动算法设计</em></h1>
<p class="sub">LLM 怎样改进算法，以及 TraceAAD 的机制与实验</p>
<div class="who"><b>方子阳</b><br><span>华南理工大学 · 导师与课题组交流</span></div>
<div class="chain">
 <div class="chev">问题建模<small>MODELING</small></div>
 <div class="chev">算法选择<small>SELECTION</small></div>
 <div class="chev">算法配置<small>CONFIGURATION</small></div>
 <div class="chev f">算法设计<small>AAD</small></div>
 <div class="chev">求解与评估<small>EVALUATION</small></div>
</div>
<svg class="route" viewBox="0 0 560 250">
 <g stroke="#1F4E9C" stroke-width="3" fill="none" stroke-linejoin="round" stroke-dasharray="2 0">
  <polyline points="280,125 120,60 60,140 170,200 280,125"/>
  <polyline points="280,125 400,50 500,100 450,190 280,125"/>
 </g>
 <g fill="#9DB6DD"><circle cx="120" cy="60" r="9"/><circle cx="60" cy="140" r="9"/><circle cx="170" cy="200" r="9"/><circle cx="400" cy="50" r="9"/><circle cx="500" cy="100" r="9"/><circle cx="450" cy="190" r="9"/></g>
 <rect x="266" y="111" width="28" height="28" fill="#E8742A"/>
</svg>
</body></html>

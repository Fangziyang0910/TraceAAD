<h1 class="h1">展望：用搜索记录训练模型，学习选择，测准相似度</h1>

<div class="fg"><svg class="ov" viewBox="0 0 1640 610"><g class="fi" style="animation-delay:0.3s"><rect x="30" y="20" width="500" height="570" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="54" y="60" fill="#C8502B">方向一</text><text class="tl" x="54" y="100" >训练：把搜索经验内化到模型</text><line x1="54" y1="122" x2="506" y2="122" stroke="#DAD6CB"/><text class="th" x="54" y="160" fill="#6C6A64">现在</text><text class="tm" x="54" y="198" >每次搜索的记录，只在这一次</text><text class="tm" x="54" y="232" >搜索内使用。</text><text class="tm" x="54" y="266" >一次运行有 1000 条尝试，每条</text><text class="tm" x="54" y="300" >带起点、代码差异和结果。</text><rect x="54" y="350" width="452" height="2" fill="#DAD6CB" stroke="none" stroke-width="1" /><text class="th" x="54" y="392" fill="#0E6B6B">可做</text><text class="tm" x="54" y="430" >用这些记录训练模型，</text><text class="tm" x="54" y="464" >让它学到算法改进的底层模式，</text><text class="tm" x="54" y="498" >而不只在提示里读到。</text></g><g class="fi" style="animation-delay:1.9s"><rect x="570" y="20" width="500" height="570" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="594" y="60" fill="#C8502B">方向二</text><text class="tl" x="594" y="100" >决策：把选择交给学习</text><line x1="594" y1="122" x2="1046" y2="122" stroke="#DAD6CB"/><text class="th" x="594" y="160" fill="#6C6A64">现在</text><text class="tm" x="594" y="198" >选起点、选算子、选上下文，</text><text class="tm" x="594" y="232" >现在是概率抽样或固定规则：</text><text class="tm" x="594" y="266" >分数项 × 经验项，算子份额</text><text class="tm" x="594" y="300" >0.45 / 0.30 / 0.25。</text><rect x="594" y="350" width="452" height="2" fill="#DAD6CB" stroke="none" stroke-width="1" /><text class="th" x="594" y="392" fill="#0E6B6B">可做</text><text class="tm" x="594" y="430" >决策模型读取搜索状态，</text><text class="tm" x="594" y="464" >预测各个选择的收益，</text><text class="tm" x="594" y="498" >再做选择。</text></g><g class="fi" style="animation-delay:3.5s"><rect x="1110" y="20" width="500" height="570" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="1134" y="60" fill="#C8502B">方向三</text><text class="tl" x="1134" y="100" >度量：把算法相似度测准</text><line x1="1134" y1="122" x2="1586" y2="122" stroke="#DAD6CB"/><text class="th" x="1134" y="160" fill="#6C6A64">现在</text><text class="tm" x="1134" y="198" >分数相同，逻辑不一定相同。</text><text class="tm" x="1134" y="232" >现在用代码相似度判断新设计</text><text class="tm" x="1134" y="266" >是否回到起点程序。</text><text class="tm" x="1134" y="300" >BehaveSim 用求解过程比较行为。</text><rect x="1134" y="350" width="452" height="2" fill="#DAD6CB" stroke="none" stroke-width="1" /><text class="th" x="1134" y="392" fill="#0E6B6B">可做</text><text class="tm" x="1134" y="430" >更稳的行为度量，用来判断</text><text class="tm" x="1134" y="464" >新设计是否成立，并分配</text><text class="tm" x="1134" y="498" >探索与利用。</text></g></svg></div><button class="rp" onclick="rp()">重播</button>

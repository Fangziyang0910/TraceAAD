<h1 class="h1">总结：把改进过程记为实测事实，让新设计先落地再竞争</h1>

<div class="fg"><svg class="ov" viewBox="0 0 1640 610"><g class="fi" style="animation-delay:0.3s"><rect x="30" y="20" width="500" height="480" fill="#FBFAF6" stroke="#0E6B6B" stroke-width="2" /><text class="tl" x="58" y="70" fill="#0E6B6B">认识</text><line x1="58" y1="90" x2="502" y2="90" stroke="#DAD6CB"/><text class="tm" x="58" y="134" >分数混合了思想的潜力</text><text class="tm" x="58" y="168" >和精炼的程度。</text><text class="tm" x="58" y="220" >新思想的出现无法预测，</text><text class="tm" x="58" y="254" >出现后还要落地和精炼。</text><text class="tm" x="58" y="306" >上下文既引导模型，</text><text class="tm" x="58" y="340" >也锚定模型。</text><text class="tm" x="58" y="392" >写法影响大，</text><text class="tm" x="58" y="426" >而且因算子而异。</text></g><g class="fi" style="animation-delay:1.5s"><rect x="570" y="20" width="500" height="480" fill="#FBFAF6" stroke="#0E6B6B" stroke-width="2" /><text class="tl" x="598" y="70" fill="#0E6B6B">方法</text><line x1="598" y1="90" x2="1042" y2="90" stroke="#DAD6CB"/><text class="tm" x="598" y="134" >记录：每次尝试带起点、</text><text class="tm" x="598" y="168" >差异和结果。</text><text class="tm" x="598" y="220" >选择：分数项 × 经验项。</text><text class="tm" x="598" y="272" >材料与目标句：</text><text class="tm" x="598" y="306" >按算子配置。</text><text class="tm" x="598" y="358" >短程落地：新设计先落地，</text><text class="tm" x="598" y="392" >再与已有程序竞争。</text></g><g class="fi" style="animation-delay:2.7s"><rect x="1110" y="20" width="500" height="480" fill="#FBFAF6" stroke="#C8502B" stroke-width="2" /><text class="tl" x="1138" y="70" fill="#C8502B">实证</text><line x1="1138" y1="90" x2="1582" y2="90" stroke="#DAD6CB"/><text class="tm" x="1138" y="134" >TSP、CVRP 六个规模全部更好，</text><text class="tm" x="1138" y="168" >优于最好的外部方法 2.2%–8.0%。</text><text class="tm" x="1138" y="220" >VRPTW 在 100、200 规模</text><text class="tm" x="1138" y="254" >好 2.2%–3.6%。</text><text class="tm" x="1138" y="306" >OP、OBP 相近。</text><text class="tm" x="1138" y="358" >3 个任务的 9 个规模排第 1。</text></g><g class="fi" style="animation-delay:4.6s"><rect x="30" y="520" width="1580" height="70" fill="#FBF1EC" stroke="#C8502B" stroke-width="1.5" /><text class="tm" x="54" y="564" >落地阶段的观察：481 个变好的新设计中，205 个回到起点程序；后续版本已改为不展示起点程序的差异。</text></g></svg></div><button class="rp" onclick="rp()">重播</button>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>P02 · 通用智能优化的定义</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
.left{position:absolute;left:140px;top:170px;width:580px}
.kw{margin-top:44px;border-top:1px solid var(--line)}
.kw div{display:flex;gap:26px;padding:22px 0;border-bottom:1px solid var(--line);font-size:25px;line-height:1.6;color:var(--body)}
.kw b{flex:none;width:76px;font-size:30px;color:var(--teal);font-weight:600}
.fig{position:absolute;left:800px;top:130px;width:980px;height:790px}
.card{fill:#F4F2EA;stroke:#DAD6CB}
.ttl{font-size:34px;font-weight:600;fill:#0E6B6B}
.dsc{font-size:22px;fill:#3B3A36}
.grp{font-size:22px;fill:#6C6A64;letter-spacing:.1em}
.in{opacity:0;animation:in .7s ease forwards}
.d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}.d5{animation-delay:2.7s}.d6{animation-delay:3.3s}
@keyframes in{to{opacity:1}}
</style></head><body>
<div class="top"><span>第一部分 · 研究领域</span><span>通用智能优化</span></div>
<div class="left">
 <h1 class="h1">通用智能优化：任何问题，都能正确建模、高效求解</h1>
 <div class="kw">
  <div><b>通用</b><span>面向全部问题：类型不限，并能泛化到新的问题。</span></div>
  <div><b>智能</b><span>由系统自主决策，并随问题特征自适应地调整求解方式。</span></div>
  <div><b>优化</b><span>对每个问题：正确建模，高效求解，得到高质量的解。</span></div>
 </div>
</div>
<svg class="fig" viewBox="0 0 980 790">
 <text class="grp" x="0" y="26">对每一个问题</text><line x1="190" y1="20" x2="980" y2="20" stroke="#DAD6CB"/>
 <!-- 正确 -->
 <g class="in d1"><rect class="card" x="0" y="44" width="300" height="270"/><text class="ttl" x="24" y="92">正确</text>
  <rect x="34" y="118" width="70" height="86" fill="#FBFAF6" stroke="#6C6A64" stroke-width="2"/><g stroke="#9C9A92" stroke-width="3"><line x1="46" y1="140" x2="92" y2="140"/><line x1="46" y1="158" x2="92" y2="158"/><line x1="46" y1="176" x2="78" y2="176"/></g>
  <path d="M116 161 H184" stroke="#6C6A64" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="196" y="118" width="70" height="86" fill="#FBFAF6" stroke="#0E6B6B" stroke-width="2"/><g stroke="#0E6B6B" stroke-width="3"><line x1="208" y1="140" x2="254" y2="140"/><line x1="208" y1="158" x2="254" y2="158"/><line x1="208" y1="176" x2="240" y2="176"/></g>
  <circle cx="150" cy="161" r="15" fill="#0E6B6B"/><path d="M142 161 l6 6 l11 -12" stroke="#FBFAF6" stroke-width="3.5" fill="none"/>
  <text class="dsc" x="24" y="244">建模忠实于问题，求解的</text><text class="dsc" x="24" y="274">正是需要求解的问题。</text></g>
 <!-- 高效 -->
 <g class="in d2"><rect class="card" x="340" y="44" width="300" height="270"/><text class="ttl" x="364" y="92">高效</text>
  <rect x="364" y="140" width="220" height="30" fill="none" stroke="#6C6A64" stroke-width="2"/>
  <rect x="364" y="140" width="70" height="30" fill="#0E6B6B"/><rect x="434" y="140" width="76" height="30" fill="#0E6B6B" fill-opacity=".65"/><rect x="510" y="140" width="40" height="30" fill="#0E6B6B" fill-opacity=".35"/>
  <line x1="584" y1="124" x2="584" y2="186" stroke="#C8502B" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="364" y="214" font-size="20" fill="#C8502B">虚线：资源与时间上限</text>
  <text class="dsc" x="364" y="244">整个求解过程，在有限的</text><text class="dsc" x="364" y="274">资源与时间内完成。</text></g>
 <!-- 高质量 -->
 <g class="in d3"><rect class="card" x="680" y="44" width="300" height="270"/><text class="ttl" x="704" y="92">高质量</text>
  <line x1="710" y1="165" x2="950" y2="165" stroke="#9C9A92" stroke-width="3"/>
  <circle cx="930" cy="165" r="11" fill="#FBFAF6" stroke="#6C6A64" stroke-width="3"/><text x="930" y="220" text-anchor="middle" font-size="20" fill="#6C6A64">最优解</text>
  <circle cx="880" cy="165" r="11" fill="#0E6B6B"/><text x="866" y="132" text-anchor="middle" font-size="20" fill="#0E6B6B">所得解</text>
  <path d="M884 182 V190 H926 V182" fill="none" stroke="#C8502B" stroke-width="2"/>
  <text class="dsc" x="704" y="244">所得的解，</text><text class="dsc" x="704" y="274">与最优解的差距很小。</text></g>
 <text class="grp" x="0" y="372">对全部问题</text><line x1="190" y1="366" x2="980" y2="366" stroke="#DAD6CB"/>
 <!-- 通用 -->
 <g class="in d4"><rect class="card" x="0" y="390" width="470" height="270"/><text class="ttl" x="24" y="438">通用</text>
  <g transform="translate(34,462)"><g fill="none" stroke="#6C6A64" stroke-width="2.5"><rect x="0" y="0" width="64" height="56"/><rect x="82" y="0" width="64" height="56"/><rect x="164" y="0" width="64" height="56"/><rect x="246" y="0" width="64" height="56" stroke="#C8502B" stroke-dasharray="5 4"/><rect x="328" y="0" width="64" height="56" stroke="#C8502B" stroke-dasharray="5 4"/></g>
   <g fill="#6C6A64"><circle cx="14" cy="14" r="4"/><circle cx="48" cy="20" r="4"/><circle cx="24" cy="42" r="4"/><circle cx="50" cy="44" r="4"/></g>
   <g fill="#6C6A64"><rect x="92" y="12" width="30" height="8"/><rect x="108" y="26" width="26" height="8"/><rect x="94" y="40" width="34" height="8"/></g>
   <g fill="#6C6A64"><rect x="174" y="12" width="20" height="30"/><rect x="198" y="22" width="20" height="20"/></g>
   <g fill="#C8502B" font-size="30" text-anchor="middle"><text x="278" y="40">？</text><text x="360" y="40">？</text></g></g>
  <text class="dsc" x="24" y="560">路径、调度、装箱，以及</text><text class="dsc" x="24" y="590">新出现的问题，类型不受限制。</text></g>
 <!-- 泛化 -->
 <g class="in d5"><rect class="card" x="510" y="390" width="470" height="270"/><text class="ttl" x="534" y="438">泛化</text>
  <line x1="540" y1="520" x2="950" y2="520" stroke="#9C9A92" stroke-width="2"/><line x1="745" y1="466" x2="745" y2="534" stroke="#C8502B" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#0E6B6B"><circle cx="580" cy="494" r="9"/><circle cx="630" cy="496" r="9"/><circle cx="690" cy="493" r="9"/></g>
  <g fill="#FBFAF6" stroke="#0E6B6B" stroke-width="3" stroke-dasharray="4 3"><circle cx="790" cy="495" r="9"/><circle cx="850" cy="494" r="9"/><circle cx="915" cy="496" r="9"/></g>
  <text x="640" y="556" text-anchor="middle" font-size="20" fill="#6C6A64">已见规模与分布</text><text x="850" y="556" text-anchor="middle" font-size="20" fill="#C8502B">未见规模与分布</text>
  <text class="dsc" x="534" y="590">对未见过的问题、规模与分布，</text><text class="dsc" x="534" y="620">表现不退化。</text></g>
 <!-- 智能 -->
 <g class="in d6"><line x1="0" y1="696" x2="980" y2="696" stroke="#0E6B6B" stroke-width="2"/>
  <text x="0" y="742" font-size="30" font-weight="600" fill="#0E6B6B">智能</text><text class="dsc" x="86" y="742" style="font-size:25px">系统自适应地调整建模与求解方式，同时达成以上各项。</text></g>
</svg>
</body></html>

<h1 class="h1">分数只给出结果；改进还取决于发现、上下文和交互方式</h1>

<div class="fg"><svg class="ov" viewBox="0 0 1640 610"><text class="tn fi" style="animation-delay:0.2s" x="36" y="44" ></text><text class="tn fi" style="animation-delay:0.2s" x="250" y="44" >我们的观察</text><text class="tn fi" style="animation-delay:0.2s" x="770" y="44" >常见做法</text><text class="tn fi" style="animation-delay:0.2s" x="1170" y="44" >对方法的要求</text><line class="fi" style="animation-delay:0.2s" x1="30" y1="62" x2="1610" y2="62" stroke="#9C9A92"/><g class="fi" style="animation-delay:0.4s"><rect x="20" y="86" width="1600" height="112" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="36" y="132" fill="#C8502B">认识一</text><text class="tl" x="36" y="168" >分数</text><text class="tm" x="250" y="132" >分数混合了两件事：</text><text class="tm" x="250" y="170" >思想的潜力，精炼的程度。</text><text class="tm" x="770" y="132" fill="#6C6A64">按分数选择起点程序。</text><text class="tm" x="1170" y="132" >选择要读到尝试结果，</text><text class="tm" x="1170" y="170" >不只读分数。</text><text class="tt" x="1590" y="184" text-anchor="end" fill="#0E6B6B">→ 设计二</text></g><g class="fi" style="animation-delay:1.4s"><rect x="20" y="214" width="1600" height="112" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="36" y="260" fill="#C8502B">认识二</text><text class="tl" x="36" y="296" >发现</text><text class="tm" x="250" y="260" >新思想何时出现无法预测，</text><text class="tm" x="250" y="298" >出现后还要落地和精炼。</text><text class="tm" x="770" y="260" fill="#6C6A64">设探索算子，找新结构。</text><text class="tm" x="1170" y="260" >给新设计落地的机会。</text><text class="tt" x="1590" y="312" text-anchor="end" fill="#0E6B6B">→ 设计四</text></g><g class="fi" style="animation-delay:2.4s"><rect x="20" y="342" width="1600" height="112" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="36" y="388" fill="#C8502B">认识三</text><text class="tl" x="36" y="424" >上下文</text><text class="tm" x="250" y="388" >模型读到什么，</text><text class="tm" x="250" y="426" >就倾向做什么。</text><text class="tm" x="770" y="388" fill="#6C6A64">把历史版本、反思放进提示。</text><text class="tm" x="1170" y="388" >给出形成过程，</text><text class="tm" x="1170" y="426" >并检验它引导了什么。</text><text class="tt" x="1590" y="440" text-anchor="end" fill="#0E6B6B">→ 设计一</text></g><g class="fi" style="animation-delay:3.4s"><rect x="20" y="470" width="1600" height="112" fill="#FBFAF6" stroke="#DAD6CB" stroke-width="1" /><text class="tt" x="36" y="516" fill="#C8502B">认识四</text><text class="tl" x="36" y="552" >交互方式</text><text class="tm" x="250" y="516" >写法影响大，</text><text class="tm" x="250" y="554" >而且因算子而异。</text><text class="tm" x="770" y="516" fill="#6C6A64">按改动的种类定义算子。</text><text class="tm" x="1170" y="516" >按算子配材料和目标句。</text><text class="tt" x="1590" y="568" text-anchor="end" fill="#0E6B6B">→ 设计三</text></g></svg></div><button class="rp" onclick="rp()">重播</button>

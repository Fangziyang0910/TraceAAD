<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>P04 · 四个研究方向</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
.h1{position:absolute;left:140px;top:140px;width:1640px}
.stage{position:absolute;left:140px;top:260px;width:1640px;height:640px;display:flex;align-items:center}
.bk{width:160px;flex:none}.ar{width:40px;flex:none}
.bk svg{display:block;width:160px;height:250px;background:#F4F2EA;border:1px solid #DAD6CB}
.bn{margin-top:18px;text-align:center;font-size:25px;font-weight:600;color:var(--ink)}
.grid{width:1240px;flex:none;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:310px;gap:20px}
.cell{display:grid;grid-template-columns:230px 1fr;border:1px solid #DAD6CB;background:#FDFCF9}
.cell svg{display:block;width:230px;height:310px;background:#F4F2EA}
.tx{padding:34px 30px 0 30px}
.eye{font-size:19px;color:var(--mute);letter-spacing:.06em}
.nm{margin:4px 0 14px;font-size:42px;font-weight:600;color:var(--teal)}
.ds{font-size:22px;line-height:1.75;color:var(--body);text-wrap:pretty}
.concl{position:absolute;left:140px;top:944px;font-size:30px;font-weight:600;color:var(--hi)}
svg text{font-family:'Source Han Serif SC','Noto Serif CJK SC','Noto Serif SC','Songti SC','STSong','SimSun','Times New Roman',serif}
.in{opacity:0;animation:in .7s ease forwards}
.cell.in{transform:translateY(16px);animation:cin .7s ease forwards}
@keyframes in{to{opacity:1}}
@keyframes cin{to{opacity:1;transform:none}}
.d0{animation-delay:.1s}.d1{animation-delay:.6s}.d2{animation-delay:1.1s}.d3{animation-delay:1.6s}.d4{animation-delay:2.1s}.d5{animation-delay:2.6s}.d6{animation-delay:3.1s}
/* 算法选择：候选依次被选中 */
.tile{fill:#FBFAF6;animation:tb 8s infinite}.tt{fill:#1D1D1B;animation:tt 8s infinite}
.t1{animation-delay:0s}.t2{animation-delay:2s}.t3{animation-delay:4s}.t4{animation-delay:6s}
@keyframes tb{0%,30%{fill:#0E6B6B}34%,100%{fill:#FBFAF6}}
@keyframes tt{0%,30%{fill:#FBFAF6}34%,100%{fill:#1D1D1B}}
/* 算法配置：参数来回调整 */
.kn{animation:kn 6s ease-in-out infinite alternate}
.k2{animation-duration:7s;animation-direction:alternate-reverse}.k3{animation-duration:5s}
@keyframes kn{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
/* 算法设计：改写-评价曲线 */
.cv{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 5s ease-in-out infinite}
.dt{opacity:0;animation:dot 5s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@keyframes dot{0%,68%{opacity:0}78%,100%{opacity:1}}
/* 问题建模：目标与约束交替突出 */
.f1{animation:f 6s infinite}.f2{animation:f 6s infinite 3s}
@keyframes f{0%,40%{fill:#0E6B6B}50%,100%{fill:#1D1D1B}}
</style></head><body>
<div class="top"><span>第一部分 · 研究领域</span><span>通用智能优化</span></div>
<h1 class="h1">通用智能优化包含四个研究方向，覆盖从问题理解到求解的全过程</h1>
<div class="stage">
 <div class="bk in d0"><svg viewBox="0 0 160 250"><g text-anchor="middle" font-size="20" fill="#3B3A36"><text x="80" y="82">1 个仓库</text><text x="80" y="121">50 个客户</text><text x="80" y="160">货车容量有限</text><text x="80" y="199" fill="#C8502B" font-weight="600">总距离最短</text></g></svg><div class="bn">自然语言问题</div></div>
 <svg class="ar in d1" viewBox="0 0 40 40" height="40"><path d="M4 20 H32 M24 11 L33 20 L24 29" fill="none" stroke="#6C6A64" stroke-width="2.5"/></svg>
 <div class="grid">
  <div class="cell in d2"><svg viewBox="0 0 230 310"><g font-size="18" fill="#C8502B"><text x="24" y="84">目标</text><text x="24" y="156">约束</text></g><g font-size="23" font-style="italic"><text class="f1" x="24" y="114">min Σ d<tspan dy="6" font-size="16">ij</tspan><tspan dy="-6"> x</tspan><tspan dy="6" font-size="16">ij</tspan></text><text class="f2" x="24" y="186">s.t. Σ q<tspan dy="6" font-size="16">i</tspan><tspan dy="-6"> y</tspan><tspan dy="6" font-size="16">i</tspan><tspan dy="-6"> ≤ Q</tspan></text></g><g font-size="17" fill="#6C6A64"><text x="24" y="250">每个客户访问一次</text><text x="24" y="278">路线从仓库出发并返回</text></g></svg>
   <div class="tx"><div class="eye">作用于：问题表述</div><div class="nm">问题建模</div><div class="ds">把自然语言描述的问题，转为数学模型：确定变量、目标与约束。</div></div></div>
  <div class="cell in d3"><svg viewBox="0 0 230 310"><g font-size="28" text-anchor="middle" stroke="#0E6B6B" stroke-width="2.5"><rect class="tile t1" x="26" y="54" width="82" height="96"/><text class="tt t1" x="67" y="114" stroke="none">甲</text><rect class="tile t2" x="122" y="54" width="82" height="96"/><text class="tt t2" x="163" y="114" stroke="none">乙</text><rect class="tile t3" x="26" y="164" width="82" height="96"/><text class="tt t3" x="67" y="224" stroke="none">丙</text><rect class="tile t4" x="122" y="164" width="82" height="96"/><text class="tt t4" x="163" y="224" stroke="none">丁</text></g></svg>
   <div class="tx"><div class="eye">作用于：算法的选用</div><div class="nm">算法选择</div><div class="ds">面对一个问题，从已有算法中选出合适的一个。不同的问题，适合不同的算法。</div></div></div>
  <div class="cell in d4"><svg viewBox="0 0 230 310"><g stroke="#9C9A92" stroke-width="3"><line x1="30" y1="80" x2="200" y2="80"/><line x1="30" y1="155" x2="200" y2="155"/><line x1="30" y1="230" x2="200" y2="230"/></g><g fill="#0E6B6B"><circle class="kn" cx="115" cy="80" r="13"/><circle class="kn k2" cx="115" cy="155" r="13"/><circle class="kn k3" cx="115" cy="230" r="13"/></g></svg>
   <div class="tx"><div class="eye">作用于：算法的参数</div><div class="nm">算法配置</div><div class="ds">确定所选算法的参数取值。同一个算法，参数不同，表现也不同。</div></div></div>
  <div class="cell in d5"><svg viewBox="0 0 230 310"><g font-size="18" fill="#3B3A36"><text x="22" y="52">优先级(节点, 状态)：</text><text x="22" y="84" fill="#C8502B" font-size="20">分数 = ……</text></g><path class="cv" pathLength="1" d="M24 250 L70 214 L105 232 L150 176 L192 150 L206 138" fill="none" stroke="#0E6B6B" stroke-width="3"/><circle class="dt" cx="206" cy="138" r="7" fill="#C8502B"/><text x="22" y="292" font-size="17" fill="#6C6A64">改写 · 评价 · 再改写</text></svg>
   <div class="tx"><div class="eye">作用于：算法的计算逻辑</div><div class="nm">算法设计</div><div class="ds">改变算法内部的计算逻辑，生成新的算法程序。关注算法本身怎样做，而不是选用或调参。</div></div></div>
 </div>
 <svg class="ar in d6" viewBox="0 0 40 40" height="40"><path d="M4 20 H32 M24 11 L33 20 L24 29" fill="none" stroke="#6C6A64" stroke-width="2.5"/></svg>
 <div class="bk in d6"><svg viewBox="0 0 160 250"><g stroke="#0E6B6B" stroke-width="2.5" fill="none"><polyline points="80,125 38,68 20,128 54,198 80,125"/><polyline points="80,125 114,50 144,110 134,184 80,125"/></g><g fill="#FBFAF6" stroke="#6C6A64" stroke-width="2"><circle cx="38" cy="68" r="7"/><circle cx="20" cy="128" r="7"/><circle cx="54" cy="198" r="7"/><circle cx="114" cy="50" r="7"/><circle cx="144" cy="110" r="7"/><circle cx="134" cy="184" r="7"/></g><rect x="72" y="117" width="16" height="16" fill="#C8502B"/></svg><div class="bn">解与分数</div></div>
</div>
<p class="concl">四个方向作用于求解的不同环节，各自解决不同的问题。</p>
</body></html>

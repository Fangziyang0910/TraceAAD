[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evotrace"
version = "4.0"
description = "Independent algorithm design with a tree-structured population and reflective elimination"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evotrace = "evotrace_v4.cli:main"

[tool.setuptools]
packages = ["evotrace_v4"]
package-dir = {evotrace_v4 = "."}

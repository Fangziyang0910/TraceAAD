<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceAAD Monitor</title>
<link rel="stylesheet" href="/monitor.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span>TraceAAD</div>
  <div class="segctl" role="group" aria-label="视图">
    <button type="button" data-view="monitor" aria-pressed="true">运行监控</button>
    <button type="button" data-view="compare" aria-pressed="false">结果对比</button>
  </div>
  <span class="spacer"></span>
  <select class="ctl" id="batch" aria-label="选择实验批次" data-for="monitor"></select>
  <span class="live" id="live"><i></i><span id="live-text">连接中</span></span>
  <div class="segctl" role="group" aria-label="数值口径">
    <button type="button" data-metric="value" aria-pressed="false">原始值</button>
    <button type="button" data-metric="fitness" aria-pressed="false">Fitness</button>
  </div>
  <button class="ctl icon" id="refresh" type="button" title="立即刷新" aria-label="立即刷新"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button class="ctl icon" id="theme" type="button" title="切换主题" aria-label="切换主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<main>
 <div id="view-monitor">
  <section class="kpis" aria-label="批次摘要">
    <div class="kpi"><div class="k">运行完成</div><div class="v" id="k-runs">–</div><div class="seg" id="k-seg"></div><div class="n" id="k-runs-n">–</div></div>
    <div class="kpi"><div class="k">搜索预算</div><div class="v" id="k-budget">–</div><div class="seg"><i class="running" id="k-budget-bar" style="width:0"></i></div><div class="n" id="k-budget-n">–</div></div>
    <div class="kpi"><div class="k">预计搜索剩余</div><div class="v" id="k-eta">–</div><div class="n" id="k-eta-n">–</div></div>
    <div class="kpi"><div class="k">有效候选</div><div class="v" id="k-nodes">–</div><div class="n" id="k-nodes-n">–</div></div>
  </section>
  <div class="error" id="error" hidden></div>
  <section class="tasks" id="tasks"><div class="skeleton"></div><div class="skeleton"></div></section>
 </div>
 <div id="view-compare" hidden>
  <section class="panel">
    <div class="panel-head"><h2 title="★ 为参照，Δ 相对参照。训练：最终程序的训练分；选择：独立选择集上的得分；测试：与训练同规模的 held-out；泛化：其他规模。各格为 rep 均值 ± 标准差。">对比对象</h2></div>
    <div class="chips" id="cmp-chips"></div>
  </section>
  <div class="error" id="cmp-error" hidden></div>
  <section class="panel" id="cmp-summary"><div class="skeleton" style="height:120px;border:0"></div></section>
  <section class="cmp-tasks" id="cmp-tasks"></section>
 </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true">
  <header class="d-head">
    <div><h2 id="d-title">运行详情</h2><div class="d-sub" id="d-sub"></div></div>
    <button class="ctl icon" id="close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="d-body" id="d-body"></div>
</aside>
<div class="tip" id="tip" hidden></div>

<script src="/monitor.js"></script>
</body>
</html>

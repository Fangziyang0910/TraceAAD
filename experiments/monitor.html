<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验监控</title>
<style>
:root {
  --ink: #202124;
  --muted: #687076;
  --line: #d9dcdf;
  --soft: #f3f4f4;
  --paper: #ffffff;
  --green: #147d64;
  --green-soft: #e4f4ee;
  --blue: #1769aa;
  --blue-soft: #e7f1f8;
  --amber: #986a12;
  --amber-soft: #fbf0d6;
  --red: #b63a32;
  --red-soft: #fae9e7;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: #f7f7f5;
  font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select { font: inherit; }
button { cursor: pointer; }

.topbar {
  min-height: 58px;
  padding: 10px 24px;
  color: #fff;
  background: #242623;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 3px solid #3aa57f;
}
.identity { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.identity strong { font-size: 17px; white-space: nowrap; }
.identity span { color: #b9c2bd; font-size: 12px; }
.controls { display: flex; align-items: center; gap: 8px; }
select, .button {
  min-height: 34px;
  border: 1px solid #c8ccca;
  border-radius: 5px;
  background: var(--paper);
  color: var(--ink);
  padding: 6px 10px;
}
.topbar select { min-width: 220px; border-color: #555b57; }
.button { font-weight: 600; }
.button { white-space: nowrap; }
.button:hover { border-color: var(--green); color: var(--green); }
.topbar .button { border-color: #555b57; }

main { max-width: 1260px; margin: 0 auto; padding: 22px 24px 60px; }
.summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 24px;
}
.metric { min-width: 0; padding: 14px 18px; border-right: 1px solid var(--line); }
.metric:nth-child(3n) { border-right: 0; }
.metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
.metric-label { color: var(--muted); font-size: 12px; }
.metric-value { margin-top: 4px; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.metric-note { margin-top: 2px; color: var(--muted); font-size: 12px; white-space: normal; }

.error {
  display: none;
  margin-bottom: 18px;
  padding: 10px 12px;
  color: var(--red);
  background: var(--red-soft);
  border-left: 3px solid var(--red);
}
.task-section { margin: 0 0 26px; }
.task-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 0 2px 9px;
  border-bottom: 2px solid #353934;
}
.task-heading h2 { margin: 0; font-size: 15px; }
.task-heading span { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; background: var(--paper); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e6e4; }
th { color: var(--muted); background: #f1f2f0; font-size: 11px; font-weight: 650; }
tbody tr:hover { background: #f6faf8; }
tbody tr:last-child td { border-bottom: 0; }
.run-button {
  width: 100%;
  padding: 0;
  border: 0;
  color: var(--blue);
  background: transparent;
  text-align: left;
  font-weight: 650;
}
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #9ba09c; }
.status.finished::before { background: var(--blue); }
.status.running::before { background: var(--green); }
.status.queued::before { background: var(--amber); }
.status.blocked::before { background: var(--red); }
.status.unknown::before { background: var(--amber); }
.progress { min-width: 110px; }
.progress-line { height: 5px; background: #e6e8e6; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); }
.progress-text { margin-top: 3px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.run-speed { margin-top: 7px; color: var(--ink); }
.run-eta { color: var(--green); }
.timing-note { color: var(--muted); font-size: 12px; margin: -12px 0 22px; }
.timing-stats { margin-top: 12px; }
.detail-stat { min-width: 0; overflow-wrap: anywhere; }
.number { font-variant-numeric: tabular-nums; }
.chart-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: -8px 0 20px; }
.chart-toolbar p { margin: 0; color: var(--muted); font-size: 12px; }
.chart-toolbar label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.training-table { min-width: 920px; }
.curve-cell { padding: 8px 10px; }
.curve-caption { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; margin-bottom: 3px; }
.breakthrough-count { color: var(--green); }

.overlay {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 20;
  background: rgba(21, 24, 22, .38);
}
.overlay.open { display: block; }
.drawer {
  position: absolute;
  top: 0;
  right: 0;
  width: min(720px, 94vw);
  height: 100%;
  overflow: auto;
  background: var(--paper);
  border-left: 1px solid #afb4b0;
  box-shadow: -10px 0 30px rgba(0, 0, 0, .14);
}
.drawer-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 17px 20px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 { margin: 0; font-size: 17px; }
.drawer-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
.icon-button {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--paper);
  color: var(--ink);
  font-size: 20px;
}
.drawer-body { padding: 20px; }
.detail-stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); }
.detail-stat { padding: 10px 12px; border-right: 1px solid var(--line); }
.detail-stat:last-child { border-right: 0; }
.detail-stat small { display: block; color: var(--muted); }
.detail-stat strong { display: block; margin-top: 3px; font-variant-numeric: tabular-nums; }
.detail-section { padding-top: 22px; }
.detail-section h3 { margin: 0 0 10px; font-size: 14px; }
.chart { width: 100%; height: 220px; display: block; border: 1px solid var(--line); background: #fbfbfa; }
.chart text { fill: var(--muted); font-size: 10px; }
.chart .grid { stroke: #e3e5e2; stroke-width: 1; }
.chart .curve { fill: none; stroke: var(--green); stroke-width: 2; vector-effect: non-scaling-stroke; }
.chart.inline-curve { height: 112px; border: 0; background: transparent; }
.chart .record-dot { fill: var(--green); stroke: white; stroke-width: 1.5; }
.chart .initial-dot { fill: white; stroke: var(--green); stroke-width: 1.7; }
.chart .point-hit { fill: transparent; cursor: pointer; }
.chart .record-point { outline: none; }
.chart .record-point:hover .record-dot, .chart .record-point:focus .record-dot,
.chart .record-point:hover .initial-dot, .chart .record-point:focus .initial-dot { stroke: var(--ink); stroke-width: 2.5; }
.chart .hover-guide { stroke: var(--green); stroke-dasharray: 3 3; opacity: .4; pointer-events: none; }
.chart-note { color: var(--muted); font-size: 12px; margin: 7px 0 0; }
.chart-tooltip { position: fixed; z-index: 50; width: 290px; max-width: calc(100vw - 20px); padding: 12px 14px; color: var(--ink); background: white; border: 1px solid #b5cfc3; border-radius: 7px; box-shadow: 0 6px 25px #15281826; pointer-events: none; }
.chart-tooltip[hidden] { display: none; }
.tooltip-heading { color: var(--green); font-weight: 700; margin-bottom: 8px; }
.tooltip-row { display: flex; justify-content: space-between; gap: 14px; margin-top: 4px; font-size: 12px; }
.tooltip-row span { color: var(--muted); flex-shrink: 0; }
.tooltip-row strong { text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.tooltip-idea { border-top: 1px solid var(--line); margin: 9px 0 0; padding-top: 8px; font-size: 12px; overflow-wrap: anywhere; }
.counts { display: flex; flex-wrap: wrap; gap: 7px; }
.count { padding: 5px 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; }
.idea { margin: 0; padding: 12px; background: var(--green-soft); border-left: 3px solid var(--green); white-space: pre-wrap; }
pre {
  max-height: 420px;
  overflow: auto;
  margin: 0;
  padding: 14px;
  color: #e9eee9;
  background: #282b28;
  border-radius: 4px;
  font: 12px/1.5 "SFMono-Regular", Consolas, monospace;
  white-space: pre;
}
.recent { width: 100%; table-layout: auto; border: 1px solid var(--line); }
.empty { padding: 40px 12px; color: var(--muted); text-align: center; }

@media (max-width: 760px) {
  .topbar { display: block; padding: 11px 14px; }
  .identity { display: flex; }
  .controls { width: 100%; margin-top: 9px; align-items: stretch; }
  .topbar select { min-width: 0; width: auto; flex: 1 1 auto; }
  main { padding: 16px 12px 44px; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  .metric:nth-child(n) { border-right: 1px solid var(--line); border-bottom: 0; }
  .metric:nth-child(2n) { border-right: 0; }
  .metric:nth-child(-n+4) { border-bottom: 1px solid var(--line); }
  th, td { padding: 9px 8px; }
  .optional-col { display: none; }
  .training-table { min-width: 690px; }
  .detail-stats { grid-template-columns: repeat(2, 1fr); }
  .detail-stat:nth-child(2) { border-right: 0; }
  .detail-stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="identity">
    <strong>实验监控</strong>
    <span>训练结果</span>
  </div>
  <div class="controls">
    <select id="experiment" aria-label="选择实验"></select>
    <button class="button" id="refresh" type="button">刷新</button>
  </div>
</header>

<main>
  <section class="summary" aria-label="批次摘要">
    <div class="metric"><div class="metric-label">运行</div><div class="metric-value" id="runs">-</div><div class="metric-note" id="run-note">-</div></div>
    <div class="metric"><div class="metric-label">搜索进度</div><div class="metric-value" id="budget">-</div><div class="metric-note" id="budget-note">-</div></div>
    <div class="metric"><div class="metric-label">搜索总速度</div><div class="metric-value" id="speed">-</div><div class="metric-note" id="speed-note">-</div></div>
    <div class="metric"><div class="metric-label">预计搜索剩余</div><div class="metric-value" id="eta">-</div><div class="metric-note" id="eta-note">-</div></div>
    <div class="metric"><div class="metric-label">有效候选</div><div class="metric-value" id="nodes">-</div><div class="metric-note">训练结果</div></div>
    <div class="metric"><div class="metric-label">更新时间</div><div class="metric-value" id="updated">-</div><div class="metric-note" id="batch-name">-</div></div>
  </section>
  <p class="timing-note">速度按已消耗预算与耗时取平均，包含失败和重复；并行剩余时间取最慢一路。估算不含搜索后的独立选择或测试，随实际速度更新。</p>
  <div class="chart-toolbar">
    <p>● 刷新该路历史最优　○ 首个有效候选 · 悬停或点按查看详情 · 每 15 秒刷新</p>
    <label>曲线纵轴 <select id="curve-metric" aria-label="曲线纵轴"><option value="fitness">Fitness · 越高越好</option><option value="value">原始目标值</option></select></label>
  </div>
  <div class="error" id="error"></div>
  <div id="tasks"><div class="empty">正在读取批次</div></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <aside class="drawer">
    <header class="drawer-head">
      <div><h2 id="detail-title">运行详情</h2><div class="drawer-subtitle" id="detail-subtitle"></div></div>
      <button class="icon-button" id="close" type="button" title="关闭" aria-label="关闭">×</button>
    </header>
    <div class="drawer-body" id="detail-body"><div class="empty">正在读取</div></div>
  </aside>
</div>

<div id="chart-tooltip" class="chart-tooltip" role="tooltip" hidden></div>

<script>
const statusText = {finished: "已完成", running: "运行中", queued: "排队中", blocked: "受阻", unknown: "未确认"};
const overlay = document.getElementById("overlay");
let activeBatch = "";
let chartMetric = "fitness";
let lastState = null;
let activeRun = null;
let lastDetail = null;
let stateRequest = 0;
let detailRequest = 0;
const tooltip = document.getElementById("chart-tooltip");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
}
function number(value, digits = 3) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
  const n = Number(value);
  return Math.abs(n) >= 100 ? n.toFixed(1) : n.toFixed(digits);
}
function shortTime(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString("zh-CN", {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
}
function duration(seconds) {
  if (seconds == null || !Number.isFinite(seconds)) return "—";
  if (seconds <= 0) return "0 分钟";
  if (seconds < 60) return "不足 1 分钟";
  const minutes = Math.ceil(seconds / 60);
  const days = Math.floor(minutes / 1440), hours = Math.floor(minutes % 1440 / 60), rest = minutes % 60;
  return [days ? `${days} 天` : "", hours ? `${hours} 小时` : "", rest ? `${rest} 分钟` : ""].filter(Boolean).join(" ");
}
function speedText(timing) {
  const rate = timing?.rate_per_minute;
  if (rate == null) return "—";
  return `${rate < .01 ? "<0.01" : rate.toFixed(2)} ${timing.unit}/分`;
}
function etaText(timing) {
  if (!timing) return "暂无估算";
  const labels = {finished: "已完成", search_complete: "搜索已结束", warming_up: "采样积累中",
    stale: "久未推进 · 暂停估算", inactive: "等待运行", partial: "部分运行暂不可估算", unavailable: "暂无估算"};
  return timing.state === "estimated" ? `约 ${duration(timing.eta_seconds)}` : labels[timing.state] || "暂无估算";
}
function timingHint(timing) {
  if (!timing) return "缺少计时记录";
  if (timing.state === "stale") return "超过 15 分钟且超过平均单次耗时的 5 倍未见候选完成；可能是慢评价，待新记录恢复估算。";
  if (timing.state === "warming_up") return "至少完成 3 个预算单位且累计 1 分钟后开始估算。";
  if (timing.state === "search_complete") return "搜索已结束；独立选择或收尾是否完成请查看运行状态。";
  if (timing.state === "inactive") return "当前未确认正在搜索，不推算完成时刻。";
  if (timing.state === "unavailable") return "缺少可靠的开始、进度时间或预算，暂不估算。";
  return `${timing.basis === "active_time" ? "按日志累计运行耗时（排除已记录的暂停间隔）" : "按开始以来的墙钟耗时（可能包含暂停）"}计算平均速度；搜索后的选择和测试另计。`;
}
function showError(message = "") {
  const el = document.getElementById("error");
  el.textContent = message;
  el.style.display = message ? "block" : "none";
}

async function loadBatches() {
  const response = await fetch("/api/batches");
  if (!response.ok) throw new Error("批次列表读取失败");
  const data = await response.json();
  const select = document.getElementById("experiment");
  select.replaceChildren(...data.batches.map(item => {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.label || item.id;
    return option;
  }));
  if (data.batches.some(item => item.id === activeBatch)) select.value = activeBatch;
  activeBatch = select.value || "";
}

async function loadState() {
  if (!activeBatch) return;
  const batch = activeBatch, request = ++stateRequest;
  try {
    const response = await fetch(`/api/state?batch=${encodeURIComponent(batch)}`);
    if (!response.ok) throw new Error("批次状态读取失败");
    const data = await response.json();
    if (batch !== activeBatch || request !== stateRequest) return;
    renderState(data);
    showError();
    if (activeRun) await loadRunDetail(false);
  } catch (error) {
    if (batch === activeBatch && request === stateRequest) showError(error.message);
  }
}

function renderState(data) {
  lastState = data;
  hideTooltip();
  const s = data.summary;
  document.getElementById("runs").textContent = `${s.finished}/${s.runs}`;
  document.getElementById("run-note").textContent = `${s.running} 运行 · ${s.queued} 排队 · ${s.blocked} 受阻 · ${s.unknown || 0} 未确认`;
  const percent = s.budget ? Math.round(s.budget_used / s.budget * 100) : 0;
  document.getElementById("budget").textContent = `${percent}%`;
  document.getElementById("budget-note").textContent = `${s.budget_used.toLocaleString()} / ${s.budget.toLocaleString()}`;
  document.getElementById("nodes").textContent = s.valid_nodes.toLocaleString();
  document.getElementById("updated").textContent = shortTime(data.updated_at);
  document.getElementById("batch-name").textContent = data.batch || "-";
  const timing = s.timing;
  document.getElementById("speed").textContent = speedText(timing);
  document.getElementById("speed-note").textContent = timing ? `运行均速之和 · 可估算 ${timing.rate_runs}/${timing.active_runs} 路` : "暂无计时数据";
  document.getElementById("eta").textContent = etaText(timing);
  document.getElementById("eta-note").textContent = timing?.eta_at ? `预计 ${shortTime(timing.eta_at)} · 按最慢一路` : timing?.pending_runs ? `可估算 ${timing.eta_runs}/${timing.pending_runs} 路待完成搜索` : "不含独立选择和测试";

  const container = document.getElementById("tasks");
  if (!data.tasks.length) {
    container.innerHTML = '<div class="empty">当前批次没有运行</div>';
    return;
  }
  container.innerHTML = data.tasks.map(task => `
    <section class="task-section">
      <header class="task-heading"><h2>${esc(task.label)}</h2><span>${chartMetric === "fitness" ? "Fitness ↑ · " : ""}原始${esc(task.unit)}${task.direction === "min" ? "越低越好" : "越高越好"}</span></header>
      <div class="table-wrap"><table class="training-table">
        <thead><tr><th style="width:7%">重复</th><th style="width:10%">状态</th><th style="width:15%">进度</th><th style="width:35%">历史最优曲线</th><th style="width:12%">${chartMetric === "fitness" ? "最佳 Fitness" : "最佳目标值"}</th><th class="optional-col" style="width:9%">有效候选</th><th class="optional-col" style="width:12%">后端</th></tr></thead>
        <tbody>${task.runs.map(run => {
          const pct = run.budget ? Math.min(100, run.budget_used / run.budget * 100) : 0;
          const records = (run.curve || []).filter(point => point.kind === "breakthrough").length;
          const best = run.curve?.at(-1)?.[chartMetric] ?? (chartMetric === "fitness" ? run.best_fitness : run.best_value);
          return `<tr>
            <td><button class="run-button" type="button" data-task="${esc(task.key)}" data-run="${esc(run.name)}">${run.repeat == null ? esc(run.name) : `Rep ${run.repeat}`}</button></td>
            <td><span class="status ${esc(run.status)}">${statusText[run.status] || esc(run.status)}</span></td>
            <td><div class="progress" title="${esc(timingHint(run.timing))}"><div class="progress-line"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text">${run.budget_used} / ${run.budget}</div><div class="progress-text run-speed">${esc(speedText(run.timing))}</div><div class="progress-text run-eta">${run.timing?.state === "estimated" ? "剩余 " : ""}${esc(etaText(run.timing))}</div></div></td>
            <td class="curve-cell"><div class="curve-caption"><span>${esc(run.x_label || "已记录序号")}</span><span class="breakthrough-count">${records} 次突破</span></div><svg class="chart inline-curve" aria-label="${esc(task.label)} Rep ${esc(run.repeat)} 历史最优曲线"></svg></td>
            <td class="number">${number(best, 5)}</td>
            <td class="number optional-col">${run.valid_nodes.toLocaleString()}</td>
            <td class="optional-col">${esc(run.backend || "-")}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
    </section>`).join("");
  container.querySelectorAll(".run-button").forEach(button => button.addEventListener("click", () => openRun(button.dataset.task, button.dataset.run)));
  const runs = data.tasks.flatMap(task => task.runs.map(run => ({run, task})));
  container.querySelectorAll(".inline-curve").forEach((svg, index) => {
    const {run, task} = runs[index];
    drawCurve(svg, run.curve, {compact: true, run, task});
  });
}

async function openRun(task, name) {
  hideTooltip();
  activeRun = {batch: activeBatch, task, name};
  lastDetail = null;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("detail-title").textContent = name;
  document.getElementById("detail-subtitle").textContent = "正在读取";
  document.getElementById("detail-body").innerHTML = '<div class="empty">正在读取</div>';
  await loadRunDetail(true);
}

async function loadRunDetail(initial) {
  if (!activeRun) return;
  const selected = activeRun, request = ++detailRequest;
  try {
    const response = await fetch(`/api/run?batch=${encodeURIComponent(selected.batch)}&task=${encodeURIComponent(selected.task)}&name=${encodeURIComponent(selected.name)}`);
    if (!response.ok) throw new Error("运行详情读取失败");
    const data = await response.json();
    if (activeRun !== selected || request !== detailRequest) return;
    renderDetail(data);
  } catch (error) {
    if (activeRun !== selected || request !== detailRequest) return;
    if (initial) document.getElementById("detail-body").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    else document.getElementById("detail-subtitle").textContent = `刷新失败，保留上次数据：${error.message}`;
  }
}

function renderDetail(run) {
  lastDetail = run;
  hideTooltip();
  const scrollTop = document.querySelector(".drawer").scrollTop;
  document.getElementById("detail-title").textContent = `${run.task_meta.label} · ${run.repeat == null ? run.name : `Rep ${run.repeat}`}`;
  document.getElementById("detail-subtitle").textContent = `${run.backend || "-"} · seed ${run.seed ?? "-"} · ${statusText[run.status] || run.status}`;
  const operators = Object.entries(run.operators).map(([key, count]) => `<span class="count">${esc(key)} ${count}</span>`).join("");
  const outcomes = Object.entries(run.outcomes).map(([key, value]) => `<span class="count">${esc(key)} ${value}</span>`).join("");
  const recent = run.recent.map(item => `<tr><td>${esc(item.evaluation ?? "-")}</td><td>${esc(item.operator || "-")}</td><td>${esc(item.status || "-")}</td><td class="number">${number(item.fitness, 5)}</td></tr>`).join("");
  const bestFitness = run.curve?.at(-1)?.fitness ?? run.best_fitness;
  const breakthroughs = (run.curve || []).filter(point => point.kind === "breakthrough").length;
  document.getElementById("detail-body").innerHTML = `
    <div class="detail-stats">
      <div class="detail-stat"><small>${esc(run.x_label || "搜索进度")}</small><strong>${run.budget_used} / ${run.budget}</strong></div>
      <div class="detail-stat"><small>有效候选</small><strong>${run.valid_nodes}</strong></div>
      <div class="detail-stat"><small>历史最佳 Fitness</small><strong>${number(bestFitness, 5)}</strong></div>
      <div class="detail-stat"><small>状态</small><strong>${statusText[run.status] || esc(run.status)}</strong></div>
    </div>
    <div class="detail-stats timing-stats" title="${esc(timingHint(run.timing))}">
      <div class="detail-stat"><small>平均搜索速度</small><strong>${esc(speedText(run.timing))}</strong></div>
      <div class="detail-stat"><small>${run.timing?.basis === "active_time" ? "累计搜索耗时" : "搜索墙钟耗时"}</small><strong>${esc(duration(run.timing?.elapsed_seconds))}</strong></div>
      <div class="detail-stat"><small>预计搜索剩余</small><strong>${esc(etaText(run.timing))}</strong></div>
      <div class="detail-stat"><small>预计搜索完成</small><strong>${run.timing?.eta_at ? esc(shortTime(run.timing.eta_at)) : "—"}</strong></div>
    </div>
    <p class="chart-note">${esc(timingHint(run.timing))}</p>
    <section class="detail-section"><h3>历史最优${chartMetric === "fitness" ? " Fitness" : "目标值"} · ${breakthroughs} 次突破</h3><svg class="chart" id="curve" aria-label="历史最优详情曲线"></svg><p class="chart-note">悬停、键盘聚焦或点按标记查看候选信息。改进幅度相对这一路此前的历史最优 Fitness。</p></section>
    <section class="detail-section"><h3>算子</h3><div class="counts">${operators || "-"}</div></section>
    <section class="detail-section"><h3>结果</h3><div class="counts">${outcomes || "-"}</div></section>
    <section class="detail-section"><h3>最近候选</h3><table class="recent"><thead><tr><th>序号</th><th>算子</th><th>结果</th><th>Fitness</th></tr></thead><tbody>${recent}</tbody></table></section>
    ${run.best ? `<section class="detail-section"><h3>最佳 Idea</h3><p class="idea" id="best-idea"></p></section><section class="detail-section"><h3>最佳代码</h3><pre id="best-code"></pre></section>` : ""}`;
  if (run.best) {
    document.getElementById("best-idea").textContent = run.best.idea || "-";
    document.getElementById("best-code").textContent = run.best.code || "";
  }
  drawCurve(document.getElementById("curve"), run.curve, {run, task: run.task_meta});
  document.querySelector(".drawer").scrollTop = scrollTop;
}

function precise(value) {
  return value == null || !Number.isFinite(Number(value)) ? "未记录" : String(Number(Number(value).toPrecision(10)));
}

function hideTooltip() {
  tooltip.hidden = true;
  document.querySelectorAll(".hover-guide").forEach(line => line.remove());
}

function showTooltip(point, options, target, event) {
  const {run, task} = options;
  const channels = {init: "初始化", main: "主干开发", trial: "连续试用", recheck: "局部重验"};
  const title = point.kind === "initial" ? "首个有效候选" : "刷新历史最优";
  const row = (label, value) => `<div class="tooltip-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
  tooltip.innerHTML = `<div class="tooltip-heading">${title} · Rep ${esc(run.repeat ?? "-")}</div>`
    + row("Fitness ↑", precise(point.fitness))
    + row(`原始${task.unit || "目标值"}`, precise(point.value))
    + row("Fitness 改进", point.gain == null ? "初始基准" : `+${precise(point.gain)}`)
    + row("算子", point.operator === "unknown" ? "未记录" : point.operator || "未记录")
    + row(run.x_label || "已记录序号", point.evaluation)
    + row("候选编号", point.candidate ?? point.node_id ?? "未记录")
    + (point.parent_id != null ? row("父代编号", point.parent_id) : "")
    + (point.channel ? row("开发通道", channels[point.channel] || point.channel) : "")
    + (point.repair_of != null ? row("修复自候选", point.repair_of) : "")
    + (point.idea ? `<p class="tooltip-idea">${esc(point.idea)}</p>` : "");
  tooltip.hidden = false;
  const rect = target.getBoundingClientRect();
  const px = Number.isFinite(event?.clientX) ? event.clientX : rect.left + rect.width / 2;
  const py = Number.isFinite(event?.clientY) ? event.clientY : rect.top + rect.height / 2;
  const box = tooltip.getBoundingClientRect();
  let left = px + 16, top = py - box.height - 12;
  if (left + box.width > window.innerWidth - 10) left = px - box.width - 16;
  if (top < 10) top = py + 16;
  tooltip.style.left = `${Math.max(10, Math.min(left, window.innerWidth - box.width - 10))}px`;
  tooltip.style.top = `${Math.max(10, Math.min(top, window.innerHeight - box.height - 10))}px`;
}

function drawCurve(svg, points, options) {
  svg._curveData = {points, options};
  svg.onpointermove = null;
  svg.onclick = null;
  svg.onpointerleave = hideTooltip;
  const width = Math.max(220, Math.round(svg.getBoundingClientRect().width));
  const height = options.compact ? 112 : 220;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  const data = (points || []).filter(point => Number.isFinite(point[chartMetric]));
  if (!data.length) {
    svg.innerHTML = `<text x="${width / 2}" y="${height / 2}" text-anchor="middle">暂无有效评价</text>`;
    return;
  }
  const left = 57, right = 12, top = 13, bottom = 27;
  const maxX = Math.max(1, data.at(-1).evaluation, options.run.budget_used || 0);
  const values = data.map(point => point[chartMetric]);
  let minY = Math.min(...values), maxY = Math.max(...values);
  const padding = (maxY - minY) * .12 || Math.max(Math.abs(maxY) * .015, .000001);
  minY -= padding; maxY += padding;
  const x = value => left + value / maxX * (width - left - right);
  const y = value => top + (maxY - value) / (maxY - minY) * (height - top - bottom);
  const coord = value => value.toFixed(2);
  let path = `M ${coord(x(data[0].evaluation))} ${coord(y(data[0][chartMetric]))}`;
  for (const point of data.slice(1)) path += ` H ${coord(x(point.evaluation))} V ${coord(y(point[chartMetric]))}`;
  path += ` H ${coord(x(maxX))}`;
  const tick = value => String(Number(value.toPrecision(5)));
  const ticks = options.compact ? [maxY, minY] : [maxY, (maxY + minY) / 2, minY];
  svg.innerHTML = ticks.map(value => `<line class="grid" x1="${left}" y1="${y(value)}" x2="${width-right}" y2="${y(value)}" /><text x="${left-6}" y="${y(value)+3}" text-anchor="end">${tick(value)}</text>`).join("")
    + `<text x="${left}" y="${height-8}" text-anchor="middle">0</text>
       <text x="${(left+width-right)/2}" y="${height-8}" text-anchor="middle">${esc(options.run.x_label || "已记录序号")}</text>
       <text x="${width-right}" y="${height-8}" text-anchor="end">${maxX}</text>
       <path class="curve" d="${path}" />`;
  const markers = data.filter(point => point.kind === "initial" || point.kind === "breakthrough");
  const targets = [];
  for (const point of markers) {
    const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const cx = x(point.evaluation), cy = y(point[chartMetric]);
    group.setAttribute("class", "record-point");
    group.setAttribute("tabindex", "0");
    group.setAttribute("role", "button");
    group.setAttribute("aria-describedby", "chart-tooltip");
    group.setAttribute("aria-label", `${point.kind === "initial" ? "初始候选" : "突破"} ${point.candidate ?? point.evaluation}，Fitness ${point.fitness}，算子 ${point.operator}`);
    group.dataset.kind = point.kind;
    group.dataset.candidate = point.candidate ?? "";
    group.innerHTML = `<circle class="${point.kind === "initial" ? "initial-dot" : "record-dot"}" cx="${cx}" cy="${cy}" r="${options.compact ? 3.3 : 4.3}" />
      <circle class="point-hit" cx="${cx}" cy="${cy}" r="9" />`;
    const show = event => {
      const key = `${options.run.name}:${point.evaluation}:${point.candidate}`;
      if (!tooltip.hidden && tooltip.dataset.pointKey === key) return;
      hideTooltip();
      const guide = document.createElementNS("http://www.w3.org/2000/svg", "line");
      for (const [key, value] of Object.entries({class: "hover-guide", x1: cx, x2: cx, y1: top, y2: height-bottom})) guide.setAttribute(key, value);
      svg.prepend(guide);
      showTooltip(point, options, group, event);
      tooltip.dataset.pointKey = key;
    };
    group.addEventListener("pointerenter", show);
    group.addEventListener("pointerleave", hideTooltip);
    group.addEventListener("focus", () => show());
    group.addEventListener("blur", hideTooltip);
    group.addEventListener("keydown", event => {
      if (["Enter", " "].includes(event.key)) {event.preventDefault(); show();}
    });
    svg.append(group);
    targets.push({cx, cy, show});
  }
  // Choose the nearest actual point when adjacent transparent hit areas overlap.
  // Keyboard focus still visits every record, including coincident points.
  const nearest = event => {
    const transform = svg.getScreenCTM();
    if (!transform) return;
    const cursor = new DOMPoint(event.clientX, event.clientY).matrixTransform(transform.inverse());
    let selected = null, distance = 12;
    for (const target of targets) {
      const d = Math.hypot(cursor.x - target.cx, cursor.y - target.cy);
      if (d < distance) {distance = d; selected = target;}
    }
    if (selected) selected.show(event);
    else hideTooltip();
  };
  svg.onpointermove = event => {if (event.pointerType !== "touch") nearest(event);};
  svg.onclick = event => {event.stopPropagation(); nearest(event);};
}

function closeDetail() {
  hideTooltip();
  activeRun = null;
  lastDetail = null;
  detailRequest++;
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}
document.getElementById("close").addEventListener("click", closeDetail);
overlay.addEventListener("click", event => { if (event.target === overlay) closeDetail(); });
document.addEventListener("keydown", event => { if (event.key === "Escape") closeDetail(); });
document.addEventListener("pointerdown", event => {if (!event.target.closest(".record-point")) hideTooltip();});
document.addEventListener("scroll", hideTooltip, true);
document.getElementById("curve-metric").addEventListener("change", event => {
  chartMetric = event.target.value;
  if (lastState) renderState(lastState);
  if (lastDetail) renderDetail(lastDetail);
});
let resizeFrame;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    hideTooltip();
    document.querySelectorAll(".chart").forEach(svg => {
      if (svg._curveData) drawCurve(svg, svg._curveData.points, svg._curveData.options);
    });
  });
});
document.getElementById("refresh").addEventListener("click", loadState);
document.getElementById("experiment").addEventListener("change", event => {
  closeDetail();
  activeBatch = event.target.value;
  loadState();
});

(async function start() {
  try {
    await loadBatches();
    await loadState();
    setInterval(loadState, 15000);
  } catch (error) {
    showError(error.message);
  }
})();
</script>
</body>
</html>

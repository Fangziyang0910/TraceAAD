[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceaad-v19-4"
version = "0.1.0"
description = "Trajectory reflection and shared experience for automatic algorithm design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tokenizers>=0.20", "huggingface-hub>=0.25"]

[project.scripts]
traceaad-v19-4 = "traceaad_v19_4.cli:main"

[tool.setuptools]
packages = ["traceaad_v19_4"]
package-dir = {traceaad_v19_4 = "."}

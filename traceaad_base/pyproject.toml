[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceaad-base"
version = "0.1.0"
description = "Independent evolutionary automatic algorithm design control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
traceaad-base = "traceaad_base.cli:main"

[tool.setuptools]
packages = ["traceaad_base"]
package-dir = {traceaad_base = "."}
